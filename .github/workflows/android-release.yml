      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp script.js www/
          cp style.css www/

      - name: Create Android project
        run: npx cap add android
